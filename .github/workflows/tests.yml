name: tests

on:
  push:
    branches:
      - dev
      - main

jobs:
  quality:
    name: Quality Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Bootstrap Backend Test Environment
        uses: ./.github/actions/backend-test-bootstrap
        with:
          setup-go: "false"

      - name: Full Test Gate
        run: composer test-all-quality

  pest-matrix:
    name: Pest / ${{ matrix.shard.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard:
          - name: Unit Suite
            target: --testsuite=Unit
          - name: Architecture Suite
            target: --testsuite=Arch
          - name: Feature - Product Core
            target: >-
              tests/Feature/Actions tests/Feature/Activities tests/Feature/Admin
              tests/Feature/Analytics tests/Feature/Auth tests/Feature/Billing
              tests/Feature/Briefings
          - name: Feature - Automation Core
            target: >-
              tests/Feature/CodeIndexing tests/Feature/Commands tests/Feature/Context
              tests/Feature/GitHub tests/Feature/Invitations tests/Feature/Jobs
              tests/Feature/Members
          - name: Feature - Reviews and Policies
            target: >-
              tests/Feature/Notifications tests/Feature/Plans tests/Feature/Promotions
              tests/Feature/ProviderKeys tests/Feature/ProviderModels tests/Feature/Queue
              tests/Feature/Reviews tests/Feature/Runs
          - name: Feature - Integrations and Workspace
            target: >-
              tests/Feature/SentinelConfig tests/Feature/Services tests/Feature/Slack
              tests/Feature/Subscriptions tests/Feature/Usage tests/Feature/Webhooks
              tests/Feature/Workspaces tests/Feature/PlanEndpointsTest.php
              tests/Feature/ReviewPromptBuilderTest.php
              tests/Feature/WorkspaceProviderKeyControllerTest.php

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Bootstrap Backend Test Environment
        uses: ./.github/actions/backend-test-bootstrap

      - name: Run Pest (${{ matrix.shard.name }})
        run: |
          set -euo pipefail
          for target in ${{ matrix.shard.target }}; do
            ./vendor/bin/pest --parallel "$target"
          done
